name: Build DockX RootHide

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: dockx-roothide-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: RootHide packages (iOS 16 and iOS 17)
    runs-on: macos-14

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup RootHide Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: roothide/theos
          sdks-src: xybp888/iOS-SDKs

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -d "${THEOS}"
          # Both packages are built by build-roothide-ios.sh with the
          # iOS 16.5 SDK; the ios17 package keeps the iOS 15 ABI target.
          test -d "${THEOS}/sdks/iPhoneOS16.5.sdk"
          test -x "${THEOS}/bin/ldid" || command -v ldid
          xcodebuild -version
          make --version | head -n 1
          bash -n build-roothide-ios.sh
          echo "Using THEOS=${THEOS}"

      - name: Build package
        shell: bash
        env:
          THEOS_PACKAGE_SCHEME: roothide
        run: |
          set -euo pipefail
          ./build-roothide-ios.sh

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for ios in ios16 ios17; do
            packages=(packages/$ios/*.deb)
            if (( ${#packages[@]} != 1 )); then
              echo "Expected exactly one $ios package, found ${#packages[@]}." >&2
              exit 1
            fi
            package="${packages[0]}"
            test -s "$package"
            file "$package"
            echo "Package: $package"
          done

      - name: Upload iOS 16 Debian package
        uses: actions/upload-artifact@v4
        with:
          name: dockx-roothide-ios16
          path: packages/ios16/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload iOS 17 Debian package
        uses: actions/upload-artifact@v4
        with:
          name: dockx-roothide-ios17
          path: packages/ios17/*.deb
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          
          # Check that we have exactly two Debian packages
          packages=(release-assets/*/*.deb)
          if (( ${#packages[@]} != 2 )); then
            echo "Expected two Debian packages, found ${#packages[@]}." >&2
            exit 1
          fi
          
          # Copy and rename packages to the root of release-assets
          for package in "${packages[@]}"; do
            artifact_name="$(basename "$(dirname "$package")")"
            package_name="$(basename "$package")"
            cp "$package" "release-assets/${artifact_name}-${package_name}"
          done
          
          echo "Prepared release assets:"
          ls -l release-assets/*.deb

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          
          tag="${GITHUB_REF_NAME}"
          assets=(release-assets/*.deb)
          
          # Ensure we have assets to upload
          if [ ${#assets[@]} -eq 0 ]; then
            echo "Error: No assets found to upload!" >&2
            exit 1
          fi
          
          echo "Tag: $tag"
          echo "Assets to upload: ${assets[@]}"
          
          # Check if release exists and create or update accordingly
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Updating existing release: $tag"
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            echo "Creating new release: $tag"
            gh release create "$tag" "${assets[@]}" \
              --title "DockX $tag" \
              --generate-notes
          fi
          
          echo "Release published successfully!"