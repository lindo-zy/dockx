name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 当推送 v 开头的标签时触发
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取完整历史，便于 --generate-notes 生成完整 Release Notes

      # 2. 设置构建环境（根据你的项目调整）
      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper devscripts

      # 3. 构建 Debian 包（根据你的项目调整）
      - name: Build Debian package
        run: |
          # 这里替换成你实际的构建命令
          # 示例：如果是用 dpkg-buildpackage
          dpkg-buildpackage -us -uc -b
          
          # 或者如果是自定义构建脚本
          # ./build.sh
          
          # 创建存放构建产物的目录
          mkdir -p release-assets
          
          # 将构建好的 .deb 文件复制到 release-assets 目录
          # 根据实际情况调整路径
          cp ../*.deb release-assets/ || echo "No .deb files in parent directory"
          # 如果 .deb 在当前目录，用这行：
          # cp *.deb release-assets/

      # 4. 列出构建产物（调试用）
      - name: List built assets
        run: |
          echo "Contents of release-assets:"
          ls -la release-assets/ || echo "Directory not found"

      # 5. 创建或更新 GitHub Release（修复后的核心步骤）
      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          
          # ============================================
          # 修复：确保在 git 仓库中（解决 fatal: not a git repository）
          # ============================================
          if [ ! -d ".git" ]; then
            echo "Initializing git repository for gh context..."
            git init
            git config user.email "actions@github.com"
            git config user.name "GitHub Actions"
            # 添加远程源，避免 gh 可能出现的警告
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null || true
          fi
          
          # 获取标签名
          tag="${GITHUB_REF_NAME}"
          
          # ============================================
          # 修复：使用 nullglob 避免空匹配时产生字面字符串
          # ============================================
          shopt -s nullglob
          assets=(release-assets/*.deb)
          shopt -u nullglob
          
          # 确保有资源要上传
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::No .deb assets found in release-assets/!"
            echo "Current directory contents:"
            ls -la
            echo "release-assets contents:"
            ls -la release-assets/ 2>/dev/null || echo "release-assets/ does not exist"
            exit 1
          fi
          
          echo "Tag: $tag"
          echo "Assets to upload: ${assets[@]}"
          
          # ============================================
          # 检查发布版本是否存在，然后创建或更新
          # ============================================
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Updating existing release: $tag"
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            echo "Creating new release: $tag"
            gh release create "$tag" "${assets[@]}" \
              --title "DockX $tag" \
              --generate-notes
          fi
          
          echo "✅ Release published successfully!"

      # 6. （可选）上传构建产物作为 Actions 的工件
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deb-packages
          path: release-assets/*.deb